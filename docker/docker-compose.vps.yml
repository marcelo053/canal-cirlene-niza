services:

  # ─── n8n workflow engine ─────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: cirlene-n8n
    ports:
      - "5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "false"
      N8N_SECURE_COOKIE: "false"
      WEBHOOK_URL: http://186.202.209.88:5678/
      FAL_KEY: ${FAL_KEY}
      MINIO_ENDPOINT: host.docker.internal
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      CIRLENE_REF_1: ${CIRLENE_REF_1}
      CIRLENE_REF_2: ${CIRLENE_REF_2}
      CIRLENE_REF_3: ${CIRLENE_REF_3}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY}
      MINIMAX_GROUP_ID: ${MINIMAX_GROUP_ID}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-pMsXgVXv3BLzUgSXRplE}
      MINIO_PUBLIC_HOST: "186.202.209.88"
      RENDERER_URL: http://renderer:3000
      MONTAGEM_URL: http://montagem:3000
      N8N_RUNNERS_ENABLED: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: "*"
      NODE_FUNCTION_ALLOW_EXTERNAL: "*"
      EXECUTIONS_TIMEOUT: 1800
      EXECUTIONS_TIMEOUT_MAX: 1800
      N8N_TASK_RUNNER_TASK_TIMEOUT: 1800
      N8N_RUNNERS_TASK_TIMEOUT: 1800
    volumes:
      - ./data/n8n:/home/node/.n8n
    restart: unless-stopped

  # ─── Remotion renderer service ────────────────────────────────────
  renderer:
    build: ./renderer
    container_name: cirlene-renderer
    ports:
      - "3001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SLIDES_DIR: /slides
      MINIO_ENDPOINT: host.docker.internal
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: cirlene-slides
      CHROME_EXECUTABLE_PATH: /usr/bin/chromium
      REMOTION_CACHE_DIR: /tmp/remotion-cache
    volumes:
      - ../slides-cientificos:/slides
    shm_size: "1gb"
    restart: unless-stopped

  # ─── Montagem (ffmpeg concat + upload) ──────────────────────────
  montagem:
    build: ./montagem
    container_name: cirlene-montagem
    ports:
      - "3002:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MINIO_ENDPOINT: host.docker.internal
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    restart: unless-stopped

  # ─── Streamlit Aprovação (:8503) ─────────────────────────────────
  aprovacao:
    image: python:3.11-slim
    container_name: cirlene-aprovacao
    command: ["sh", "-c", "pip install -q -r /app/requirements.txt && streamlit run /app/aprovacao_cirlene.py"]
    ports:
      - "8503:8503"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../src/platform:/app
    environment:
      STREAMLIT_SERVER_PORT: "8503"
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
      STREAMLIT_SERVER_HEADLESS: "true"
      BASEROW_URL: ${BASEROW_URL:-http://host.docker.internal:85}
      BASEROW_TOKEN: ${BASEROW_TOKEN:-}
      BASEROW_TABLE_PRODUCTIONS: ${BASEROW_TABLE_PRODUCTIONS:-}
      BASEROW_TABLE_SCENES: ${BASEROW_TABLE_SCENES:-}
      FIELD_APPROVAL_STATUS: ${FIELD_APPROVAL_STATUS:-}
      FIELD_APPROVAL_FEEDBACK: ${FIELD_APPROVAL_FEEDBACK:-}
      FIELD_TITLE: ${FIELD_TITLE:-}
      FIELD_PRODUCTION_ID: ${FIELD_PRODUCTION_ID:-}
      FIELD_COST: ${FIELD_COST:-}
      MINIO_ENDPOINT: http://host.docker.internal:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    restart: unless-stopped

networks:
  default:
    name: cirlene-network
